# Copy this file to the repository root as:
# .github/workflows/deploy-software-architecture-description.yml

name: Deploy Software Architecture Description

on:
  push:
    branches: [main]
    paths:
      - 'immigration-courses/software-architecture-description/**'
      - '.github/workflows/deploy-software-architecture-description.yml'
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Build lesson
        working-directory: immigration-courses/software-architecture-description
        run: myst build --html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: immigration-courses/software-architecture-description/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
